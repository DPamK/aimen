[project]
name = "aimen"
version = "0.0.3"
description = "AIMEN - AI-driven Development Workflow System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["questionary"]

[project.scripts]
aimen = "aimen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimen"]
artifacts = ["src/aimen/template/**/*"]
